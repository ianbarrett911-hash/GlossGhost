<div id="email-share-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
  <div class="w-full max-w-lg rounded-3xl border border-brand-cyan/30 bg-brand-dark shadow-2xl p-6 sm:p-7 text-left">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-[10px] uppercase tracking-[0.22em] font-black text-brand-cyan">Email a friend</p>
        <h3 class="mt-2 text-2xl sm:text-3xl font-black tracking-tight text-white">Share by email</h3>
      </div>
      <button onclick="closeEmailShareModal()" class="text-white/60 hover:text-brand-cyan transition-colors p-2 rounded-lg hover:bg-white/5" aria-label="Close email share modal">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <p class="mt-4 text-sm text-brand-muted leading-relaxed">Your desktop may not have a default mail app set. Use the actions below to open your email client or copy a ready-made draft.</p>

    <div class="mt-5 rounded-2xl border border-white/10 bg-white/5 p-4 space-y-3 text-sm">
      <div>
        <div class="text-[10px] uppercase tracking-[0.18em] text-brand-muted font-black">Subject</div>
        <div class="mt-1 text-white">GlossGhost | Premium Waterless Detail Spray</div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-[0.18em] text-brand-muted font-black">Message</div>
        <div class="mt-1 text-brand-muted leading-relaxed">GlossGhost is worth a look. Check it out here: <span id="email-share-url" class="text-white"></span></div>
      </div>
    </div>

    <div class="mt-6 flex flex-col gap-3">
      <button onclick="launchEmailClient()" class="w-full px-5 py-3 bg-brand-cyan hover:bg-brand-darkCyan text-black font-black text-xs tracking-[0.14em] uppercase rounded-xl transition-colors">
        Open email app
      </button>
      <button onclick="copyGlossGhostEmailDraft().then((copied) => { if (copied) { openInterestNoticeModal({ title: 'Draft copied', message: 'The email draft has been copied to your clipboard.', kicker: 'Copied', tone: 'success' }); } else { openInterestNoticeModal({ title: 'Copy unavailable', message: 'Your browser blocked clipboard access. Try the email app option instead.', kicker: 'Heads up', tone: 'error' }); } })" class="w-full px-5 py-3 bg-white/5 hover:bg-white/10 text-white font-black text-xs tracking-[0.14em] uppercase rounded-xl border border-white/10 transition-colors">
        Copy email draft
      </button>
      <button onclick="closeEmailShareModal()" class="w-full px-5 py-3 bg-white/5 hover:bg-white/10 text-white font-black text-xs tracking-[0.14em] uppercase rounded-xl border border-white/10 transition-colors">
        Close
      </button>
    </div>
  </div>
</div>
