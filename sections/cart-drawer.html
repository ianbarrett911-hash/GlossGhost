<div id="cart-overlay" onclick="toggleCartDrawer()" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300"></div>
<div id="cart-drawer" class="fixed right-0 top-0 bottom-0 z-50 w-full sm:w-[450px] bg-brand-dark border-l border-white/10 translate-x-full transition-transform duration-300 flex flex-col justify-between text-left">
  <div class="p-6 border-b border-white/5 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <svg class="w-5 h-5 text-brand-cyan animate-bounce" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      <span class="text-sm font-black tracking-widest uppercase text-white">YOUR SHOPPING CART</span>
    </div>
    <button onclick="toggleCartDrawer()" class="text-white/60 hover:text-brand-cyan transition-colors duration-200 p-2 hover:bg-white/5 rounded-xl">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>

  <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-6">
    <div id="cart-empty-state" class="h-full flex flex-col items-center justify-center text-center space-y-4 py-20">
      <svg class="w-16 h-16 text-brand-muted/20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      <div class="space-y-1">
        <span class="text-xs font-black tracking-wider text-white uppercase block">YOUR CART IS EMPTY</span>
        <span class="text-[10px] text-brand-muted font-medium">Add premium items to get started detailing.</span>
      </div>
    </div>

    <div id="cart-items-list" class="space-y-4 hidden"></div>
  </div>

  <div id="cart-checkout-box" class="p-6 border-t border-white/5 bg-brand-card/50 space-y-6 hidden">
    <div class="space-y-3">
      <div class="flex items-center justify-between text-xs font-semibold text-brand-muted"><span>SUBTOTAL</span><span id="cart-subtotal">£0.00</span></div>
      <div class="flex items-center justify-between text-xs font-semibold text-brand-muted"><span>SHIPPING</span><span class="text-brand-cyan">FREE UK DELIVERY</span></div>
      <div class="w-full h-px bg-white/5"></div>
      <div class="flex items-center justify-between text-sm font-black text-white"><span>TOTAL</span><span id="cart-total" class="text-brand-cyan">£0.00</span></div>
    </div>

    <button onclick="alert('Thank you for your purchase! Detailing order simulated successfully.'); clearCart(); toggleCartDrawer();" class="w-full py-4 bg-brand-cyan hover:bg-brand-darkCyan text-black font-black text-xs tracking-[0.2em] uppercase rounded-xl transition-all duration-300 shadow-cyan-glow hover:shadow-cyan-glow-strong">
      PROCEED TO CHECKOUT →
    </button>
  </div>
</div>
