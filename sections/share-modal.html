<div id="share-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
  <div class="w-full max-w-lg rounded-3xl border border-brand-cyan/30 bg-brand-dark shadow-2xl p-6 sm:p-7 text-left">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-[10px] uppercase tracking-[0.22em] font-black text-brand-cyan">Share GlossGhost</p>
        <h3 class="mt-2 text-2xl sm:text-3xl font-black tracking-tight text-white">Send it to a friend</h3>
      </div>
      <button onclick="closeShareModal()" class="text-white/60 hover:text-brand-cyan transition-colors p-2 rounded-lg hover:bg-white/5" aria-label="Close share modal">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <p class="mt-4 text-sm text-brand-muted leading-relaxed">Share the GlossGhost page using your phone’s share options, or copy the link / email it from desktop.</p>

    <div class="mt-6 flex flex-col gap-3">
      <button onclick="copyGlossGhostLink().then((copied) => { if (copied) { openInterestNoticeModal({ title: 'Link copied', message: 'The GlossGhost page link is copied to your clipboard.', kicker: 'Copied', tone: 'success' }); } else { openInterestNoticeModal({ title: 'Copy unavailable', message: 'Your browser blocked clipboard access. Use the email option instead.', kicker: 'Heads up', tone: 'error' }); } })" class="w-full px-5 py-3 bg-brand-cyan hover:bg-brand-darkCyan text-black font-black text-xs tracking-[0.14em] uppercase rounded-xl transition-colors">
        Copy link
      </button>
      <button onclick="emailGlossGhostLink()" class="w-full px-5 py-3 bg-white/5 hover:bg-white/10 text-white font-black text-xs tracking-[0.14em] uppercase rounded-xl border border-white/10 transition-colors">
        Email a friend
      </button>
      <button onclick="closeShareModal()" class="w-full px-5 py-3 bg-white/5 hover:bg-white/10 text-white font-black text-xs tracking-[0.14em] uppercase rounded-xl border border-white/10 transition-colors">
        Close
      </button>
    </div>
  </div>
</div>
