<header class="sticky top-0 z-40 bg-brand-dark/95 backdrop-blur-md border-b border-white/5 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.reload();">
        <div class="relative h-14 flex items-center justify-center rounded-xl px-2 overflow-visible z-30">
          <img src="images/logoonly.png" alt="GlossGhost" class="h-40 lg:h-[12.75rem] w-auto max-w-none object-contain -mb-16">
        </div>
      </div>

      <nav class="hidden md:flex items-center space-x-10 text-xs font-bold tracking-[0.15em] uppercase">
        <a href="#home" class="text-brand-cyan border-b-2 border-brand-cyan pb-1 transition-all duration-200">HOME</a>
        <a href="#shop" class="text-white/70 hover:text-brand-cyan transition-colors duration-200 pb-1 border-b-2 border-transparent hover:border-brand-cyan">SHOP</a>
        <a href="#about" class="text-white/70 hover:text-brand-cyan transition-colors duration-200 pb-1 border-b-2 border-transparent hover:border-brand-cyan">ABOUT</a>
        <a href="#reviews" class="text-white/70 hover:text-brand-cyan transition-colors duration-200 pb-1 border-b-2 border-transparent hover:border-brand-cyan">REVIEWS</a>
        <a href="#blog" class="text-white/70 hover:text-brand-cyan transition-colors duration-200 pb-1 border-b-2 border-transparent hover:border-brand-cyan">BLOG</a>
        <a href="#contact" class="text-white/70 hover:text-brand-cyan transition-colors duration-200 pb-1 border-b-2 border-transparent hover:border-brand-cyan">CONTACT</a>
      </nav>

      <div class="flex items-center space-x-6">
        <button class="text-white/70 hover:text-brand-cyan transition-colors duration-200 p-2 rounded-lg hover:bg-white/5">
          <img src="images/icons/search.svg" alt="Search" class="w-5 h-5 icon-lib">
        </button>
        <button class="text-white/70 hover:text-brand-cyan transition-colors duration-200 p-2 rounded-lg hover:bg-white/5">
          <img src="images/icons/account.svg" alt="Account" class="w-5 h-5 icon-lib">
        </button>
        <button onclick="toggleCartDrawer()" class="relative text-white/70 hover:text-brand-cyan transition-all duration-200 p-2 rounded-lg hover:bg-white/5 group">
          <img src="images/icons/cart.svg" alt="Cart" class="w-5 h-5 icon-lib">
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-brand-cyan text-black font-black text-[9px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-brand-dark shadow-cyan-glow group-hover:scale-110 transition-transform duration-200">0</span>
        </button>
        <button onclick="toggleMobileMenu()" class="md:hidden text-white/70 hover:text-brand-cyan transition-colors duration-200 p-2 rounded-lg hover:bg-white/5">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="mobile-menu" class="hidden md:hidden bg-brand-dark/95 border-b border-white/5 px-4 pt-2 pb-6 space-y-3 transition-all duration-300">
    <a href="#home" onclick="toggleMobileMenu()" class="block text-brand-cyan font-bold tracking-wider py-2 border-b border-white/5">HOME</a>
    <a href="#shop" onclick="toggleMobileMenu()" class="block text-white/70 hover:text-brand-cyan font-bold tracking-wider py-2 border-b border-white/5">SHOP</a>
    <a href="#about" onclick="toggleMobileMenu()" class="block text-white/70 hover:text-brand-cyan font-bold tracking-wider py-2 border-b border-white/5">ABOUT</a>
    <a href="#reviews" onclick="toggleMobileMenu()" class="block text-white/70 hover:text-brand-cyan font-bold tracking-wider py-2 border-b border-white/5">REVIEWS</a>
    <a href="#blog" onclick="toggleMobileMenu()" class="block text-white/70 hover:text-brand-cyan font-bold tracking-wider py-2 border-b border-white/5">BLOG</a>
    <a href="#contact" onclick="toggleMobileMenu()" class="block text-white/70 hover:text-brand-cyan font-bold tracking-wider py-2">CONTACT</a>
  </div>
</header>
