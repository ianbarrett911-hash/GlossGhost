<div id="interest-notice-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300 flex items-center justify-center p-4">
  <div class="w-full max-w-lg rounded-3xl border border-brand-cyan/30 bg-brand-dark shadow-2xl p-6 sm:p-7 text-left">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p id="interest-notice-kicker" class="text-[10px] uppercase tracking-[0.22em] font-black text-brand-cyan">Confirmation</p>
        <h3 id="interest-notice-title" class="mt-2 text-2xl sm:text-3xl font-black tracking-tight text-white">You're on the list</h3>
      </div>
      <button onclick="closeInterestNoticeModal()" class="text-white/60 hover:text-brand-cyan transition-colors p-2 rounded-lg hover:bg-white/5" aria-label="Close notice">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <p id="interest-notice-message" class="mt-4 text-sm text-brand-muted leading-relaxed">Thanks for registering your interest. Please check your inbox for confirmation (double opt-in).</p>

    <div class="mt-6 flex flex-col sm:flex-row gap-3">
      <button onclick="closeInterestNoticeModal()" class="w-full sm:w-auto px-5 py-3 bg-brand-cyan hover:bg-brand-darkCyan text-black font-black text-xs tracking-[0.14em] uppercase rounded-xl transition-colors">
        Back to site
      </button>
      <button onclick="shareGlossGhostPage()" class="w-full sm:w-auto px-5 py-3 bg-white/5 hover:bg-white/10 text-white font-black text-xs tracking-[0.14em] uppercase rounded-xl border border-white/10 transition-colors">
        Share with a friend
      </button>
    </div>
  </div>
</div>
